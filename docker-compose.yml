version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: config/Dockerfile.backend
      target: development
    container_name: norma3100-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=norma3100
      - DB_USER=postgres
      - DB_PASSWORD=postgres_dev_password
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev_jwt_secret_change_in_production
      - LOG_LEVEL=debug
      - EMAIL_PROVIDER=resend
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM_ADDRESS=onboarding@resend.dev
      - EMAIL_FROM_NAME=Sistema Norma 3100
      - EVOLUTION_API_URL=http://evolution:8080
      - EVOLUTION_API_KEY=norma3100_evo_key_2025
      - EVOLUTION_INSTANCE_NAME=norma3100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - norma-network
    volumes:
      - ./backend/.env:/app/.env
      - ./backend/src:/app/src
      - ./backend/db:/app/db
      - ./backend/scripts:/app/scripts
      - ./docs:/app/docs
      - /app/node_modules
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 30s
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: norma3100-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=
      - VITE_ENV=development
    depends_on:
      - backend
    networks:
      - norma-network
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: npm run dev

  postgres:
    image: postgres:14-alpine
    container_name: norma3100-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=norma3100
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_dev_password
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - norma-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  evolution:
    image: atendai/evolution-api:latest
    container_name: norma3100-evolution
    ports:
      - "8080:8080"
    environment:
      - DOCKER_ENV=true
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://evolution:8080
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
      - LOG_LEVEL=ERROR
      - LOG_COLOR=true
      - LOG_BAILEYS=error
      - DEL_INSTANCE=false
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres_dev_password@postgres:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_norma3100
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=false
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_LABELS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_SAVE_IS_ON_WHATSAPP=false
      - DATABASE_DELETE_MESSAGE=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_TTL=604800
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
      - AUTHENTICATION_API_KEY=norma3100_evo_key_2025
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - QRCODE_LIMIT=30
      - LANGUAGE=es
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - norma-network
    volumes:
      - evolution_data:/evolution/instances
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: norma3100-redis
    ports:
      - "6379:6379"
    networks:
      - norma-network
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  norma-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  evolution_data:
    driver: local
