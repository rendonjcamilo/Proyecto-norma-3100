name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Escribe "deploy-prod" para confirmar deploy manual a producción'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS (app.habilitapro.com)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validar confirmación manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirmation }}" != "deploy-prod" ]; then
            echo "Escribe exactamente: deploy-prod"
            exit 1
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          key_path: ''
          port: 22
          timeout: 120s
          command_timeout: 8m
          script: |
            set -e
            echo "=== Deploy: $(date) ==="
            cd /opt/norma3100

            echo "=== GIT PULL ==="
            git pull origin main
            echo "Commit: $(git rev-parse --short HEAD)"

            echo "=== MIGRACIONES (pre-build) ==="
            docker compose -f docker-compose.prod.yml exec -T backend npm run migrate:up

            echo "=== BUILD FRONTEND ==="
            docker compose -f docker-compose.prod.yml build frontend
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend

            echo "=== BUILD Y DEPLOY BACKEND ==="
            docker compose -f docker-compose.prod.yml build backend
            docker compose -f docker-compose.prod.yml up -d --no-deps backend

            echo "=== MIGRACIONES (post-build) ==="
            sleep 10
            docker compose -f docker-compose.prod.yml exec -T backend npm run migrate:up

            echo "=== VERIFICAR SALUD ==="
            sleep 20
            curl -fsS --max-time 10 http://localhost:3001/health || echo "Health check pendiente de confirmar"
            docker compose -f docker-compose.prod.yml ps
            echo "Deploy completado: $(date)"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
