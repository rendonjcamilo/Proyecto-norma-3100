name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS (app.habilitapro.com)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 5m
          debug: true
          script: |
            set -e
            cd /opt/norma3100

            echo "=== GIT PULL ==="
            git pull origin main
            echo "Commit desplegado: $(git rev-parse --short HEAD)"

            echo "=== BUILD Y DEPLOY FRONTEND ==="
            docker compose -f docker-compose.prod.yml build frontend
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend

            echo "=== BUILD Y DEPLOY BACKEND ==="
            docker compose -f docker-compose.prod.yml build backend
            docker compose -f docker-compose.prod.yml up -d --no-deps backend

            echo "=== MIGRACIONES ==="
            sleep 10
            docker compose -f docker-compose.prod.yml exec -T backend npm run migrate:up

            echo "=== VERIFICAR SALUD ==="
            sleep 5
            docker compose -f docker-compose.prod.yml ps
            echo "Deploy completado: $(date)"
