name: Deploy to Production

# Dispara en push a main
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── 1. Validaciones previas ────────────────────────────────────────────────
  pre-deploy-check:
    name: Pre-deploy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: ESLint check
        working-directory: ./backend
        run: npm run lint || true

  # ── 2. Deploy al VPS vía SSH ───────────────────────────────────────────────
  deploy:
    name: Deploy to VPS (app.habilitapro.com)
    runs-on: ubuntu-latest
    needs: pre-deploy-check
    environment:
      name: production
      url: https://app.habilitapro.com

    steps:
      - name: Pull latest code on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 147.93.45.4
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            cd /opt/norma3100
            git fetch origin main
            git reset --hard origin/main
            echo "Código actualizado: $(git rev-parse --short HEAD)"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 147.93.45.4
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: bash /opt/norma3100/scripts/deploy.sh

  # ── 3. Resumen post-deploy ────────────────────────────────────────────────
  notify:
    name: Post-deploy summary
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Result
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "Deploy exitoso en https://app.habilitapro.com"
            echo "Commit: ${{ github.sha }} — Actor: ${{ github.actor }}"
          else
            echo "ERROR: Deploy fallido — revisar logs en GitHub Actions"
          fi
