name: Lint & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend - Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: ESLint
        working-directory: ./backend
        run: npm run lint

      - name: TypeScript strict check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Check OpenAPI spec validity
        working-directory: ./backend
        run: |
          node --experimental-specifier-resolution=node -e "
            import('./dist/config/openapi.config.js').then(m => {
              const spec = m.openapiSpec;
              if (!spec.info || !spec.paths) {
                console.error('Invalid OpenAPI spec');
                process.exit(1);
              }
              console.log('OpenAPI spec valid with', Object.keys(spec.paths).length, 'paths');
            }).catch(err => {
              console.log('Skipping OpenAPI check (no build):', err.message);
            });
          " || true

  frontend-lint:
    name: Frontend - Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: TypeScript check & build
        working-directory: ./frontend
        run: npm run build
