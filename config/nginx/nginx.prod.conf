# nginx.prod.conf — Reverse proxy de producción para Norma 3100
# Reemplaza TU_DOMINIO con el dominio real (ej: norma3100.tuempresa.com)
# Requiere certbot instalado en el VPS:
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d TU_DOMINIO

server {
    listen 80;
    server_name TU_DOMINIO www.TU_DOMINIO;

    # Redirige todo HTTP → HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name TU_DOMINIO www.TU_DOMINIO;

    # ── TLS 1.3 — Certificados Let's Encrypt ───────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS: 1 año, incluir subdominios
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Headers de seguridad ────────────────────────────────────────────────
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Proxy → Backend API ─────────────────────────────────────────────────
    location /api {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Limitar tamaño de subidas
        client_max_body_size 15m;
    }

    location /auth {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # Rate limiting extra en auth (complementa el de Express)
        limit_req zone=auth_limit burst=10 nodelay;
    }

    location /health {
        proxy_pass http://backend:3001;
        access_log off;
    }

    # ── Frontend (React SPA) ────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Caché de assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend:80;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Swagger/Docs (solo en staging, bloquear en producción si se desea) ──
    location /api/docs {
        proxy_pass http://backend:3001;
        # Descomenta para bloquear docs en producción:
        # deny all;
        # return 403;
    }
}

# Zona de rate limiting para el bloque auth
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
