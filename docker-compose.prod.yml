# docker-compose.prod.yml — Stack de producción (VPS Hostinger)
# Diferencias clave vs docker-compose.yml (dev):
#   - Imágenes preconstruidas desde GHCR (no build local)
#   - Variables desde .env.production (no hardcodeadas)
#   - Sin volúmenes de hot-reload (sin ./src montado)
#   - Healthchecks habilitados en backend
#   - restart: always en todos los servicios
#   - Nginx como reverse proxy (443 → backend:3001 y frontend:5173)
#
# Secretos requeridos en el VPS como /opt/norma3100/.env.production:
#   DB_PASSWORD, JWT_SECRET, JWT_REFRESH_SECRET, ENCRYPTION_KEY,
#   BACKUP_PASSPHRASE, RESEND_API_KEY, CORS_ORIGIN
#
# Para configurar: cp .env.example .env.production && nano .env.production

version: '3.9'

services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:latest
    container_name: norma3100-backend
    restart: always
    ports:
      - "127.0.0.1:3001:3001"   # Solo accesible desde localhost (nginx hace proxy)
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - norma-network
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:latest
    container_name: norma3100-frontend
    restart: always
    ports:
      - "127.0.0.1:5173:80"     # Nginx sirve el build estático en prod
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - norma-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:14-alpine
    container_name: norma3100-postgres
    restart: always
    # Puerto NO expuesto al exterior — solo accesible desde la red Docker interna
    environment:
      - POSTGRES_DB=${DB_NAME:-norma3100}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    networks:
      - norma-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: norma3100-redis
    restart: always
    # Puerto NO expuesto al exterior
    networks:
      - norma-network
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.25-alpine
    container_name: norma3100-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - norma-network
    volumes:
      - ./config/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro    # Certificados Let's Encrypt (certbot)
      - /var/www/certbot:/var/www/certbot:ro    # Desafíos ACME
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  norma-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  backups_data:
    driver: local
